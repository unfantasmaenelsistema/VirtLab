<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <linearGradient id="winBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f4f7"/>
      <stop offset="100%" stop-color="#d8dde4"/>
    </linearGradient>
    <linearGradient id="toolBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e3e6ea"/>
    </linearGradient>
    <linearGradient id="selVm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEBFC"/>
      <stop offset="100%" stop-color="#C1DCFC"/>
    </linearGradient>
    <linearGradient id="secHdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#dde6f0"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1100" height="620" rx="6" fill="#ece9d8" stroke="#68839b" stroke-width="2"/>
  
  <!-- Title Bar -->
  <rect x="2" y="2" width="1096" height="28" rx="4" fill="url(#winBar)"/>
  <circle cx="18" cy="16" r="7" fill="#1b5e91"/>
  <text x="32" y="20" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Administrador de Oracle VM VirtualBox — VirtLab Educational Simulator</text>
  
  <!-- Menu Bar -->
  <rect x="2" y="30" width="1096" height="22" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="1"/>
  <text x="14" y="45" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#111">Archivo     Máquina     Red Virtual     Ayuda</text>

  <!-- Top Toolbar -->
  <rect x="2" y="52" width="1096" height="64" fill="url(#toolBar)" stroke="#b8b8b8" stroke-width="1"/>
  
  <!-- Toolbar Buttons -->
  <g transform="translate(16, 58)">
    <!-- Nueva -->
    <rect x="0" y="0" width="64" height="50" rx="4" fill="#e9f2fc" stroke="#7da2ce"/>
    <circle cx="32" cy="19" r="11" fill="#2980b9"/>
    <path d="M32 12 L32 26 M25 19 L39 19" stroke="#f1c40f" stroke-width="3"/>
    <text x="32" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#111">Nueva</text>

    <!-- Configuración -->
    <rect x="72" y="0" width="84" height="50" rx="4" fill="none"/>
    <circle cx="114" cy="19" r="11" fill="#e67e22"/>
    <circle cx="114" cy="19" r="4" fill="#fff"/>
    <text x="114" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Configuración</text>

    <!-- Clonar -->
    <rect x="164" y="0" width="60" height="50" rx="4" fill="none"/>
    <rect x="182" y="9" width="14" height="14" fill="#60a5fa" stroke="#1d4ed8"/>
    <rect x="190" y="15" width="14" height="14" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="194" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Clonar</text>

    <!-- Iniciar -->
    <rect x="240" y="0" width="64" height="50" rx="4" fill="#ecfdf5" stroke="#10b981"/>
    <polygon points="264,9 284,19 264,29" fill="#27ae60"/>
    <text x="272" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#065f46">Iniciar</text>

    <!-- Consola -->
    <rect x="312" y="0" width="68" height="50" rx="4" fill="none"/>
    <rect x="331" y="9" width="30" height="20" rx="2" fill="#111827" stroke="#475569"/>
    <text x="336" y="22" font-family="Consolas, monospace" font-size="9" fill="#4ade80">&gt;_</text>
    <text x="346" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Consola</text>

    <!-- Consola Host -->
    <rect x="388" y="0" width="84" height="50" rx="4" fill="none"/>
    <rect x="415" y="9" width="30" height="20" rx="2" fill="#0f172a" stroke="#38bdf8"/>
    <text x="420" y="22" font-family="Consolas, monospace" font-size="9" fill="#38bdf8">$_</text>
    <text x="430" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Consola Host</text>

    <!-- Mapa de Red -->
    <rect x="480" y="0" width="82" height="50" rx="4" fill="none"/>
    <circle cx="521" cy="13" r="4" fill="#0284c7"/>
    <circle cx="509" cy="25" r="4" fill="#16a34a"/>
    <circle cx="533" cy="25" r="4" fill="#ea580c"/>
    <line x1="521" y1="17" x2="509" y2="21" stroke="#334155" stroke-width="1.5"/>
    <line x1="521" y1="17" x2="533" y2="21" stroke="#334155" stroke-width="1.5"/>
    <text x="521" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Mapa de Red</text>

    <!-- Retos CTF -->
    <rect x="570" y="0" width="78" height="50" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <path d="M602 9 L602 29 M602 10 L618 15 L602 20 Z" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
    <rect x="622" y="4" width="22" height="13" rx="6" fill="#15803d"/>
    <text x="633" y="13" text-anchor="middle" font-family="Consolas, monospace" font-size="9" font-weight="bold" fill="#fff">2/4</text>
    <text x="609" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#14532d">Retos CTF</text>

    <!-- Enlace Práctica -->
    <rect x="656" y="0" width="108" height="50" rx="4" fill="none"/>
    <circle cx="710" cy="19" r="9" fill="none" stroke="#0284c7" stroke-width="2"/>
    <text x="710" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#111">Enlace Práctica</text>
  </g>

  <!-- Left Pane: VM Inventory -->
  <rect x="6" y="120" width="300" height="466" fill="#ffffff" stroke="#a0a0a0"/>
  <rect x="7" y="121" width="298" height="24" fill="#eef2f7"/>
  <text x="16" y="137" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#334155">Máquinas Virtuales (3)</text>

  <!-- VM Item 1 (Selected) -->
  <rect x="10" y="150" width="290" height="52" rx="3" fill="url(#selVm)" stroke="#7da2ce"/>
  <circle cx="32" cy="176" r="14" fill="#dd4814"/>
  <text x="32" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#fff">DEB</text>
  <text x="54" y="171" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Ubuntu-Server-Web</text>
  <circle cx="59" cy="186" r="4" fill="#16a34a"/>
  <text x="68" y="190" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d" font-weight="600">Corriendo — 10.0.2.15</text>

  <!-- VM Item 2 -->
  <rect x="10" y="208" width="290" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="32" cy="234" r="14" fill="#a80030"/>
  <text x="32" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#fff">LNX</text>
  <text x="54" y="229" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Debian-DB-Node</text>
  <circle cx="59" cy="244" r="4" fill="#16a34a"/>
  <text x="68" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">Corriendo — 192.168.56.101</text>

  <!-- VM Item 3 -->
  <rect x="10" y="266" width="290" height="52" rx="3" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="32" cy="292" r="14" fill="#0078d7"/>
  <text x="32" y="296" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold" fill="#fff">WIN</text>
  <text x="54" y="287" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Windows-10-Cliente</text>
  <circle cx="59" cy="302" r="4" fill="#64748b"/>
  <text x="68" y="306" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Apagada</text>

  <!-- Right Pane: Details Panel -->
  <rect x="312" y="120" width="782" height="466" fill="#f7f9fc" stroke="#a0a0a0"/>
  <rect x="313" y="121" width="780" height="32" fill="#e8eef5"/>
  <text x="328" y="142" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Detalles — Ubuntu-Server-Web (Corriendo)</text>

  <!-- Section: General -->
  <rect x="328" y="166" width="460" height="115" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="329" y="167" width="458" height="24" fill="url(#secHdr)"/>
  <text x="342" y="183" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">General y Sistema</text>
  <text x="342" y="208" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Nombre:</text>
  <text x="460" y="208" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Ubuntu-Server-Web</text>
  <text x="342" y="228" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Sistema Operativo:</text>
  <text x="460" y="228" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">Ubuntu (64-bit) — Linux</text>
  <text x="342" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Memoria base:</text>
  <text x="460" y="248" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">2048 MB</text>
  <text x="342" y="268" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Orden de arranque:</text>
  <text x="460" y="268" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">Óptica, Disco duro, Red</text>

  <!-- Preview Monitor -->
  <rect x="804" y="166" width="272" height="165" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="805" y="167" width="270" height="24" fill="url(#secHdr)"/>
  <text x="818" y="183" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Previsualización</text>
  <rect x="822" y="200" width="236" height="118" rx="2" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <text x="832" y="220" font-family="Consolas, monospace" font-size="10" fill="#4ade80">Ubuntu 22.04.4 LTS tty1</text>
  <text x="832" y="238" font-family="Consolas, monospace" font-size="10" fill="#93c5fd">root@ubuntu-server-web:~# ip a</text>
  <text x="832" y="254" font-family="Consolas, monospace" font-size="9" fill="#e2e8f0">eth0: inet 10.0.2.15/24</text>
  <text x="832" y="270" font-family="Consolas, monospace" font-size="9" fill="#e2e8f0">eth1: inet 192.168.56.102/24</text>
  <text x="832" y="294" font-family="Consolas, monospace" font-size="9" fill="#facc15">[Clic para abrir terminal interactiva]</text>

  <!-- Section: Red -->
  <rect x="328" y="295" width="460" height="150" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="329" y="296" width="458" height="24" fill="url(#secHdr)"/>
  <text x="342" y="312" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Red (4 Adaptadores VirtualBox)</text>
  <text x="342" y="338" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Adaptador 1:</text>
  <text x="445" y="338" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Intel PRO/1000 MT Desktop (NAT — 10.0.2.15/24) [PF: 8080-&gt;80]</text>
  <text x="342" y="360" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Adaptador 2:</text>
  <text x="445" y="360" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Intel PRO/1000 MT Desktop (Sólo-anfitrión — 192.168.56.102/24)</text>
  <text x="342" y="382" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Adaptador 3:</text>
  <text x="445" y="382" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Inhabilitado</text>
  <text x="342" y="404" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Adaptador 4:</text>
  <text x="445" y="404" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Inhabilitado</text>
  <text x="342" y="428" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Estado DHCP:</text>
  <text x="445" y="428" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#15803d">Concesión activa (DORA ACK: 10.0.2.15 via 10.0.2.2)</text>

  <!-- Section: Almacenamiento y Descripción -->
  <rect x="328" y="458" width="748" height="112" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="329" y="459" width="746" height="24" fill="url(#secHdr)"/>
  <text x="342" y="475" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Almacenamiento y Notas de Laboratorio</text>
  <text x="342" y="502" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Controlador SATA:</text>
  <text x="460" y="502" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">Ubuntu-Server-Web.vdi (Normal, 25,00 GB)</text>
  <text x="342" y="524" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Servicios simulados:</text>
  <text x="460" y="524" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">Apache2 HTTP Server (:80), OpenSSH (:22), cliente DHCP/ICMP/Traceroute</text>
  <text x="342" y="546" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b"> Persistencia:</text>
  <text x="460" y="546" font-family="Segoe UI, sans-serif" font-size="11" fill="#0284c7">LocalStorage sincronizado + Exportación de escenario por URL (?escenario=Base64)</text>

  <!-- Status Bar -->
  <rect x="2" y="590" width="1096" height="28" fill="#e4e7eb" stroke="#b8b8b8"/>
  <circle cx="18" cy="604" r="5" fill="#16a34a"/>
  <text x="30" y="608" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">Motor VirtualBox Red Activo — Host Física: 192.168.1.100 | Host-Only: 192.168.56.1 | Gateway NAT: 10.0.2.2</text>
  <rect x="910" y="594" width="176" height="20" rx="3" fill="#1e293b"/>
  <text x="998" y="608" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">⚙ Opciones del Instructor</text>
</svg>
