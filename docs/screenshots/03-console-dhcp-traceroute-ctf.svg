<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <!-- Window Frame -->
  <rect x="0" y="0" width="1100" height="620" rx="6" fill="#090d16" stroke="#334155" stroke-width="2"/>

  <!-- Top Window Title -->
  <rect x="2" y="2" width="1096" height="32" rx="4" fill="#1e293b"/>
  <circle cx="20" cy="18" r="6" fill="#22c55e"/>
  <text x="36" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Ubuntu-Server-Web [Corriendo] — Consola Interactiva TTY (Oracle VM VirtualBox)</text>

  <!-- Quick Command Toolbar -->
  <rect x="2" y="34" width="1096" height="36" fill="#0f172a" stroke="#1e293b"/>
  <text x="16" y="56" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">Atajos rápidos:</text>
  <rect x="105" y="41" width="54" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="132" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e2e8f0">ip a</text>
  <rect x="166" y="41" width="76" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="204" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#38bdf8">dhclient</text>
  <rect x="249" y="41" width="96" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="297" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4ade80">ping 8.8.8.8</text>
  <rect x="352" y="41" width="136" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="420" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#facc15">traceroute 8.8.8.8</text>
  <rect x="495" y="41" width="66" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="528" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e2e8f0">arp -a</text>
  <rect x="568" y="41" width="106" height="22" rx="3" fill="#1e293b" stroke="#475569"/>
  <text x="621" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#e2e8f0">netstat -tuln</text>
  <rect x="681" y="41" width="118" height="22" rx="3" fill="#14532d" stroke="#22c55e"/>
  <text x="740" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#86efac">ufw allow icmp</text>

  <!-- Terminal Output Area -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5">
    <!-- 1. DHCP DORA Process -->
    <text x="22" y="96" fill="#4ade80">root@ubuntu-server-web:~# <tspan fill="#ffffff">dhclient</tspan></text>
    <text x="22" y="116" fill="#cbd5e1">Internet Systems Consortium DHCP Client 4.4.3</text>
    <text x="22" y="136" fill="#38bdf8">DHCPDISCOVER sent to 255.255.255.255... (port 67, Adaptador 1 - eth0 [NAT])</text>
    <text x="22" y="156" fill="#facc15">DHCPOFFER received from 10.0.2.2... (Offered IP: 10.0.2.15)</text>
    <text x="22" y="176" fill="#38bdf8">DHCPREQUEST sent... (Requesting 10.0.2.15 from 10.0.2.2)</text>
    <text x="22" y="196" fill="#4ade80" font-weight="bold">DHCPACK received. IP Address assigned: 10.0.2.15</text>

    <!-- 2. Traceroute -->
    <text x="22" y="232" fill="#4ade80">root@ubuntu-server-web:~# <tspan fill="#ffffff">traceroute 8.8.8.8</tspan></text>
    <text x="22" y="252" fill="#cbd5e1">traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets</text>
    <text x="22" y="272" fill="#e2e8f0"> 1  gateway-nat.vbox (10.0.2.2)  2 ms  1 ms  3 ms</text>
    <text x="22" y="292" fill="#e2e8f0"> 2  router-fisico.lan (192.168.1.1)  9 ms  12 ms  8 ms</text>
    <text x="22" y="312" fill="#4ade80"> 3  dns.google (8.8.8.8)  19 ms  21 ms  18 ms</text>

    <!-- 3. Firewall Blocking -> Unblocking -> Ping + CTF Flag -->
    <text x="22" y="348" fill="#4ade80">root@ubuntu-server-web:~# <tspan fill="#ffffff">ufw allow icmp</tspan></text>
    <text x="22" y="368" fill="#86efac">Rule updated: ALLOW IN/OUT proto icmp on Ubuntu-Server-Web</text>
    <text x="22" y="388" fill="#86efac">iptables: Regla DROP ICMP eliminada. Tráfico ping (ICMP Echo) permitido.</text>

    <text x="22" y="422" fill="#4ade80">root@ubuntu-server-web:~# <tspan fill="#ffffff">ping 8.8.8.8</tspan></text>
    <text x="22" y="442" fill="#cbd5e1">PING 8.8.8.8 (8.8.8.8) 56(84) bytes of data.</text>
    <text x="22" y="462" fill="#e2e8f0">64 bytes from 8.8.8.8: icmp_seq=1 ttl=63 time=14.8 ms</text>
    <text x="22" y="482" fill="#e2e8f0">64 bytes from 8.8.8.8: icmp_seq=2 ttl=63 time=15.2 ms</text>
    <text x="22" y="502" fill="#e2e8f0">64 bytes from 8.8.8.8: icmp_seq=3 ttl=63 time=14.4 ms</text>
    <text x="22" y="522" fill="#cbd5e1">--- 8.8.8.8 ping statistics --- 4 packets transmitted, 4 received, 0% packet loss</text>

    <!-- Bright Neon Green CTF Banner -->
    <rect x="20" y="536" width="760" height="30" rx="4" fill="#052e16" stroke="#00ff66" stroke-width="1.5"/>
    <text x="32" y="556" fill="#00ff66" font-weight="bold">[+] RETO COMPLETADO. Flag: flag{v1rtu4l_n3tw0rk_m4st3r}</text>
  </g>

  <!-- Bottom Prompt Bar -->
  <rect x="2" y="580" width="1096" height="38" fill="#020617" stroke="#1e293b"/>
  <text x="22" y="604" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#4ade80">root@ubuntu-server-web:~#</text>
  <text x="235" y="604" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">netstat -tuln █</text>
</svg>
