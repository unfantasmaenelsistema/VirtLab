<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <rect x="0" y="0" width="1100" height="620" rx="6" fill="#0f172a"/>

  <!-- Left Side: Interactive Topology Map -->
  <rect x="16" y="16" width="690" height="588" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="18" y="18" width="686" height="34" rx="4" fill="#1e3a8a"/>
  <text x="34" y="40" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Mapa Interactivo de Topología de Red VirtualBox</text>

  <!-- Card 1: NAT -->
  <rect x="32" y="68" width="320" height="245" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="33" y="69" width="318" height="32" rx="4" fill="#eff6ff"/>
  <text x="46" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">Switch NAT (10.0.2.0/24)</text>
  <text x="46" y="114" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Gateway / DHCP: 10.0.2.2 | Salida a Internet 8.8.8.8</text>
  <rect x="46" y="128" width="292" height="72" rx="4" fill="#f8fafc" stroke="#93c5fd"/>
  <text x="58" y="148" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Ubuntu-Server-Web (Adaptador 1)</text>
  <text x="58" y="166" font-family="Consolas, monospace" font-size="11" fill="#15803d">IP: 10.0.2.15/24 (DHCP DORA ACK)</text>
  <text x="58" y="184" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">Port Forwarding: Host :8080 -&gt; VM :80</text>

  <!-- Card 2: Adaptador Puente -->
  <rect x="368" y="68" width="320" height="245" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="369" y="69" width="318" height="32" rx="4" fill="#f0fdf4"/>
  <text x="382" y="90" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#15803d">Adaptador Puente (LAN 192.168.1.0/24)</text>
  <text x="382" y="114" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Anfitrión: 192.168.1.100 | Gateway LAN: 192.168.1.1</text>
  <rect x="382" y="128" width="292" height="72" rx="4" fill="#f8fafc" stroke="#86efac"/>
  <text x="394" y="148" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Windows-10-Cliente (Adaptador 1)</text>
  <text x="394" y="166" font-family="Consolas, monospace" font-size="11" fill="#15803d">IP: 192.168.1.51/24 (Visible en toda la LAN)</text>
  <text x="394" y="184" font-family="Consolas, monospace" font-size="10" fill="#64748b">MAC: 08:00:27:9B:11:4E</text>

  <!-- Card 3: Solo-Anfitrión -->
  <rect x="32" y="330" width="320" height="254" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="33" y="331" width="318" height="32" rx="4" fill="#fef3c7"/>
  <text x="46" y="352" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#b45309">Sólo-Anfitrión (vboxnet0 — 192.168.56.0/24)</text>
  <text x="46" y="376" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Anfitrión Host-Only: 192.168.56.1 | Sin salida a Internet</text>
  <rect x="46" y="390" width="292" height="72" rx="4" fill="#f8fafc" stroke="#fcd34d"/>
  <text x="58" y="410" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Debian-DB-Node (Adaptador 1)</text>
  <text x="58" y="428" font-family="Consolas, monospace" font-size="11" fill="#b45309">IP: 192.168.56.101/24 (DHCP 192.168.56.100)</text>
  <text x="58" y="446" font-family="Consolas, monospace" font-size="10" fill="#64748b">Aislada de WAN 8.8.8.8 | Visible desde 192.168.56.1</text>

  <!-- Card 4: Red Interna -->
  <rect x="368" y="330" width="320" height="254" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="369" y="331" width="318" height="32" rx="4" fill="#f3e8ff"/>
  <text x="382" y="352" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Red Interna (Switch: "intnet")</text>
  <text x="382" y="376" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">Sin servidor DHCP automático (APIPA 169.254.X.X o Estática)</text>
  <rect x="382" y="390" width="292" height="72" rx="4" fill="#f8fafc" stroke="#d8b4fe"/>
  <text x="394" y="410" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Clúster Backend ("intnet")</text>
  <text x="394" y="428" font-family="Consolas, monospace" font-size="11" fill="#6b21a8">IP Estática: ip set 10.10.10.1 | 10.10.10.2</text>
  <text x="394" y="446" font-family="Consolas, monospace" font-size="10" fill="#64748b">Aislado de Anfitrión e Internet</text>

  <!-- Right Side: Opciones del Instructor (Modo Dios) -->
  <rect x="720" y="16" width="364" height="588" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="722" y="18" width="360" height="40" rx="4" fill="#0f172a"/>
  <text x="740" y="43" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#facc15">⚙ Opciones del Instructor (Modo Dios)</text>

  <text x="738" y="78" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbd5e1">Inyección de fallos en caliente para prácticas:</text>

  <!-- Fault 1: Desconectar Cable -->
  <rect x="736" y="92" width="332" height="106" rx="5" fill="#0f172a" stroke="#ef4444"/>
  <text x="750" y="114" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#f87171">1. Desconectar cable virtual</text>
  <text x="750" y="132" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Simula desmarcar "Cable conectado". El comando</text>
  <text x="750" y="146" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">ping devuelve "Network is unreachable" y DHCP falla.</text>
  <rect x="750" y="160" width="304" height="26" rx="3" fill="#7f1d1d"/>
  <text x="902" y="177" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#fecaca">⚡ Cable desconectado en Debian-DB-Node</text>

  <!-- Fault 2: Firewall DROP ICMP -->
  <rect x="736" y="210" width="332" height="106" rx="5" fill="#0f172a" stroke="#f59e0b"/>
  <text x="750" y="232" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">2. Regla DROP en iptables / Firewall</text>
  <text x="750" y="250" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Bloquea respuestas ICMP Echo (Request timed out).</text>
  <text x="750" y="264" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Se resuelve con "ufw allow icmp" (activa Reto CTF).</text>
  <rect x="750" y="278" width="304" height="26" rx="3" fill="#78350f"/>
  <text x="902" y="295" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#fde68a">🛡 Activar Firewall DROP ICMP en VM</text>

  <!-- Fault 3: MAC Duplicada / IP Conflict -->
  <rect x="736" y="328" width="332" height="106" rx="5" fill="#0f172a" stroke="#a855f7"/>
  <text x="750" y="350" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">3. MAC Address Duplicada / IP Conflict</text>
  <text x="750" y="368" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Fuerza colisión de IP y MAC en Adaptador Puente,</text>
  <text x="750" y="382" font-family="Segoe UI, sans-serif" font-size="10" fill="#94a3b8">causando pérdida aleatoria del 50% de paquetes.</text>
  <rect x="750" y="396" width="304" height="26" rx="3" fill="#581c87"/>
  <text x="902" y="413" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#e9d5ff">⚡ Forzar Conflicto IP/MAC en Puente</text>

  <!-- Share URL & Reset Buttons -->
  <rect x="736" y="452" width="332" height="62" rx="5" fill="#0f172a" stroke="#38bdf8"/>
  <text x="750" y="472" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Escenarios Compartibles por URL (Base64)</text>
  <text x="750" y="492" font-family="Consolas, monospace" font-size="9.5" fill="#e2e8f0">?escenario=eyJ2IjoxLCJ2bXMiOlt7Im5hbWUiOiJV...</text>

  <rect x="736" y="530" width="332" height="36" rx="4" fill="#16a34a"/>
  <text x="902" y="553" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">↺ Restaurar estado de laboratorio</text>
</svg>
