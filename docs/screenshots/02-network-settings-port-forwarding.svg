<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620">
  <defs>
    <linearGradient id="hdrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f5f8"/>
      <stop offset="100%" stop-color="#d9e0e8"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="1100" height="620" rx="6" fill="#1e293b"/>

  <!-- Network Settings Dialog -->
  <rect x="40" y="28" width="660" height="560" rx="5" fill="#f0f0f0" stroke="#64748b" stroke-width="2"/>
  <rect x="42" y="30" width="656" height="28" rx="3" fill="url(#hdrGrad)"/>
  <text x="58" y="49" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Ubuntu-Server-Web — Configuración</text>

  <!-- Left Category Sidebar -->
  <rect x="54" y="70" width="135" height="460" fill="#ffffff" stroke="#a0a0a0"/>
  <text x="72" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">General</text>
  <text x="72" y="122" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Sistema</text>
  <text x="72" y="148" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Pantalla</text>
  <text x="72" y="174" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Almacenamiento</text>
  <rect x="56" y="188" width="131" height="28" fill="#cde4fc" stroke="#60a5fa"/>
  <text x="72" y="206" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Red</text>

  <!-- Right Config Area -->
  <rect x="200" y="70" width="486" height="460" fill="#ffffff" stroke="#a0a0a0"/>
  
  <!-- Adapter Tabs -->
  <rect x="212" y="84" width="96" height="26" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="260" y="101" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">Adaptador 1</text>
  <rect x="310" y="86" width="96" height="24" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="358" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Adaptador 2</text>
  <rect x="408" y="86" width="96" height="24" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="456" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Adaptador 3</text>
  <rect x="506" y="86" width="96" height="24" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="554" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Adaptador 4</text>

  <!-- Adapter Panel Body -->
  <rect x="212" y="110" width="462" height="404" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <!-- Checkbox Enable -->
  <rect x="228" y="128" width="14" height="14" rx="2" fill="#2563eb"/>
  <path d="M231 135 L234 138 L240 131" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="250" y="139" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Habilitar adaptador de red</text>

  <!-- Conectado a -->
  <text x="228" y="172" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Conectado a:</text>
  <rect x="330" y="156" width="324" height="24" rx="2" fill="#ffffff" stroke="#64748b"/>
  <text x="340" y="172" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">NAT</text>
  <polygon points="640,165 648,165 644,171" fill="#334155"/>

  <!-- Nombre / Opciones disponibles -->
  <text x="228" y="204" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Modos soportados:</text>
  <text x="330" y="204" font-family="Segoe UI, sans-serif" font-size="10" fill="#0369a1">NAT | Adaptador Puente | Red interna (intnet) | Adaptador sólo-anfitrión</text>

  <!-- Advanced Section -->
  <text x="228" y="238" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">▼ Avanzado</text>
  <line x1="295" y1="234" x2="654" y2="234" stroke="#cbd5e1"/>

  <text x="238" y="264" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Tipo de adaptador:</text>
  <rect x="350" y="248" width="304" height="22" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="263" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Intel PRO/1000 MT Desktop (82540EM)</text>

  <text x="238" y="294" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Dirección MAC:</text>
  <rect x="350" y="278" width="210" height="22" fill="#ffffff" stroke="#94a3b8"/>
  <text x="360" y="293" font-family="Consolas, monospace" font-size="11" fill="#0f172a">0800274A9C12</text>

  <!-- Cable conectado -->
  <rect x="350" y="312" width="14" height="14" rx="2" fill="#2563eb"/>
  <path d="M353 319 L356 322 L362 315" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="372" y="323" font-family="Segoe UI, sans-serif" font-size="11" fill="#0f172a">Cable conectado</text>

  <!-- Botón Reenvío de puertos -->
  <rect x="350" y="340" width="160" height="28" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="430" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">Reenvío de puertos</text>

  <!-- Explaining Box -->
  <rect x="228" y="384" width="430" height="114" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="240" y="404" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Comportamiento del Modo NAT (10.0.2.0/24)</text>
  <text x="240" y="424" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">• IP por DHCP (dhclient / ipconfig /renew): 10.0.2.15 | Gateway: 10.0.2.2</text>
  <text x="240" y="442" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">• Salida hacia Internet (8.8.8.8) y red del Anfitrión permitida.</text>
  <text x="240" y="460" font-family="Segoe UI, sans-serif" font-size="10" fill="#334155">• El Anfitrión NO puede iniciar conexiones directas salvo con Reenvío de Puertos.</text>
  <text x="240" y="478" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">• Reglas activas: 1 regla configurada (Host 8080 -&gt; Guest 80)</text>

  <!-- Sub-Modal: Reenvío de Puertos (Overlaid on Right) -->
  <rect x="520" y="130" width="550" height="390" rx="5" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="522" y="132" width="546" height="28" rx="3" fill="#1e3a8a"/>
  <text x="538" y="150" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Reglas de reenvío de puertos (NAT — Adaptador 1)</text>

  <text x="538" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Mapea puertos locales del Anfitrión hacia servicios internos de la VM (ej. curl localhost:8080):</text>

  <!-- Table Header -->
  <rect x="538" y="194" width="514" height="26" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="548" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Nombre</text>
  <text x="640" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Protocolo</text>
  <text x="710" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">IP anfitrión</text>
  <text x="795" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Puerto anfitrión</text>
  <text x="890" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">IP invitado</text>
  <text x="975" y="211" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Puerto inv.</text>

  <!-- Row 1 -->
  <rect x="538" y="220" width="514" height="28" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="548" y="238" font-family="Consolas, monospace" font-size="11" fill="#0f172a">HTTP-Web</text>
  <text x="640" y="238" font-family="Consolas, monospace" font-size="11" fill="#0f172a">TCP</text>
  <text x="710" y="238" font-family="Consolas, monospace" font-size="11" fill="#0f172a">127.0.0.1</text>
  <text x="795" y="238" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#1d4ed8">8080</text>
  <text x="890" y="238" font-family="Consolas, monospace" font-size="11" fill="#0f172a">10.0.2.15</text>
  <text x="975" y="238" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#15803d">80</text>

  <!-- Row 2 -->
  <rect x="538" y="248" width="514" height="28" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="548" y="266" font-family="Consolas, monospace" font-size="11" fill="#0f172a">SSH-Admin</text>
  <text x="640" y="266" font-family="Consolas, monospace" font-size="11" fill="#0f172a">TCP</text>
  <text x="710" y="266" font-family="Consolas, monospace" font-size="11" fill="#0f172a">127.0.0.1</text>
  <text x="795" y="266" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#1d4ed8">2222</text>
  <text x="890" y="266" font-family="Consolas, monospace" font-size="11" fill="#0f172a">10.0.2.15</text>
  <text x="975" y="266" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#15803d">22</text>

  <!-- Host Console Verification Preview inside Modal -->
  <rect x="538" y="294" width="514" height="162" rx="4" fill="#090d16" stroke="#334155"/>
  <text x="552" y="316" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">anfitrion@host-fisico:~$ curl localhost:8080</text>
  <text x="552" y="336" font-family="Consolas, monospace" font-size="11" fill="#4ade80">HTTP/1.1 200 OK - Apache Server on Ubuntu-Server-Web</text>
  <text x="552" y="354" font-family="Consolas, monospace" font-size="10" fill="#cbd5e1">Server: Apache/2.4.58 (Ubuntu) | X-VirtLab-NAT-Rule: HTTP-Web (127.0.0.1:8080 -&gt; 10.0.2.15:80)</text>
  <text x="552" y="382" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">anfitrion@host-fisico:~$ curl localhost:9090</text>
  <text x="552" y="400" font-family="Consolas, monospace" font-size="11" fill="#f87171">curl: (7) Failed to connect to localhost port 9090: Connection refused</text>
  <text x="552" y="432" font-family="Consolas, monospace" font-size="11" font-weight="bold" fill="#00ff66">[+] RETO COMPLETADO. Flag: flag{n4t_p0rt_f0rw4rd_pr0}</text>

  <!-- Buttons -->
  <rect x="538" y="472" width="120" height="28" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="598" y="490" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#166534">+ Añadir regla</text>
  <rect x="860" y="472" width="90" height="28" rx="3" fill="#2563eb"/>
  <text x="905" y="490" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Aceptar</text>
  <rect x="962" y="472" width="90" height="28" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="1007" y="490" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Cancelar</text>
</svg>
