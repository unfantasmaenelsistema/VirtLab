<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VirtLab — Simulador de VirtualBox</title>
  <meta name="description" content="Simulador educativo del Administrador de VirtualBox 7.1 en el navegador: crea máquinas virtuales, instala sistemas, configura redes NAT, puente, red interna y solo anfitrión, y practica con laboratorios guiados.">
  <meta name="theme-color" content="#0b2a5e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 6.5v15L16 30 4 23.5v-15z' fill='%231f6fd0'/%3E%3Cpath d='M16 2l12 6.5L16 15 4 8.5z' fill='%239dd0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/virtlab.css">
</head>
<body>
  <div id="root">
    <main id="desktop" aria-label="Escritorio del equipo anfitrión">
      <div class="desk-icons"></div>
    </main>
    <footer id="taskbar">
      <button id="tb-start" class="tb-app tb-start" title="Inicio" aria-label="Inicio"></button>
      <div id="tb-apps"></div>
      <div class="tb-tray"><button id="tb-net" aria-label="Red del anfitrión"></button><div class="tb-clock"></div></div>
    </footer>
  </div>
  <noscript><p style="color:#fff;padding:20px">VirtLab necesita JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
